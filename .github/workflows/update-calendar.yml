name: Update Taiwan Calendar Data

on:
  schedule:
    # 每週一 UTC 00:00 (台灣時間 08:00)。政府約在每年年中公告隔年度辦公日曆，
    # 且年底前可能再修正（例如新增補假），所以全年每週檢查；沒有變更時不會開 PR。
    - cron: '0 0 * * 1'
  workflow_dispatch:
    # 允許手動觸發

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 用 PAT（非預設 GITHUB_TOKEN），這樣機器人開的 PR 才會觸發 CI，
          # required check 才會回報，auto-merge 才能在綠燈後自動合併。
          token: ${{ secrets.DATA_BOT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update script
        run: python scripts/update_calendar.py

      - name: Regenerate llms facts
        run: python scripts/generate_llms.py

      - name: Generate static year pages
        run: python scripts/generate_pages.py

      - name: Open PR and enable auto-merge if data changed
        env:
          GH_TOKEN: ${{ secrets.DATA_BOT_TOKEN }}
        run: |
          # 用 git status 而不是 git diff：新年度的檔案是「未追蹤」檔，git diff 看不到，
          # 會讓新年度資料永遠不被提交（2027 年資料曾因此漏掉）。
          if [ -z "$(git status --porcelain data/ llms.txt llms-full.txt sitemap.xml 20[0-9][0-9]/)" ]; then
            echo "資料無變更，結束。"
            exit 0
          fi

          STAMP=$(date +'%Y%m%d-%H%M%S')
          BRANCH="auto/update-calendar-${STAMP}"

          git config user.name "calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/ llms.txt llms-full.txt sitemap.xml 20[0-9][0-9]/
          git commit -m "chore: update calendar data $(date +'%Y-%m-%d')"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore: 自動更新行事曆資料 $(date +'%Y-%m-%d')" \
            --body "由 update-calendar workflow 自動產生。CI（資料驗證）通過後會自動合併進 main。")

          # 開啟 auto-merge：等 required check 綠燈後 GitHub 自動 squash 合併並刪分支。
          gh pr merge "$PR_URL" --squash --auto --delete-branch
